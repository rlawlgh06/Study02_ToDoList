<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>할 일 관리</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card: #ffffff;
    --text: #1f2328;
    --muted: #6b7280;
    --line: #e3e5e8;
    --accent: #2f6feb;

    --work-bg: #e3edff;
    --work-fg: #1f4fbf;
    --personal-bg: #e0f5e9;
    --personal-fg: #1d7a4b;
    --study-bg: #f1e7fb;
    --study-fg: #7038ad;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 32px 16px;
    background: var(--bg);
    color: var(--text);
    font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic",
                 system-ui, -apple-system, sans-serif;
    font-size: 15px;
    line-height: 1.5;
  }

  .app {
    max-width: 600px;
    margin: 0 auto;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 12px;
    overflow: hidden;
  }

  .section {
    padding: 16px 20px;
    border-bottom: 1px solid var(--line);
  }
  .section:last-child { border-bottom: none; }

  /* 헤더와 진행률 */
  h1 {
    margin: 0 0 12px;
    font-size: 20px;
    font-weight: 700;
  }

  .progress-row {
    display: flex;
    align-items: center;
    gap: 12px;
  }

  .progress-track {
    flex: 1;
    height: 8px;
    background: var(--line);
    border-radius: 999px;
    overflow: hidden;
  }

  .progress-fill {
    height: 100%;
    width: 0%;
    background: var(--accent);
    border-radius: 999px;
    transition: width 0.2s ease;
  }

  .progress-text {
    font-size: 13px;
    color: var(--muted);
    font-variant-numeric: tabular-nums;
    white-space: nowrap;
  }

  /* 입력줄 */
  .input-row {
    display: flex;
    gap: 8px;
  }

  input[type="text"], select {
    font: inherit;
    padding: 9px 11px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
    color: inherit;
  }

  #todo-input { flex: 1; min-width: 0; }

  input[type="text"]:focus-visible,
  select:focus-visible,
  button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 1px;
  }

  /* 입력 거부 피드백 */
  .invalid {
    border-color: #d93025;
    animation: shake 0.25s;
  }
  @keyframes shake {
    25% { transform: translateX(-4px); }
    75% { transform: translateX(4px); }
  }

  button {
    font: inherit;
    padding: 9px 14px;
    border: 1px solid var(--line);
    border-radius: 8px;
    background: #fff;
    color: inherit;
    cursor: pointer;
  }
  button:hover { background: #f7f8f9; }

  .primary {
    background: var(--accent);
    border-color: var(--accent);
    color: #fff;
  }
  .primary:hover { background: #255ccc; }

  /* 필터 탭 */
  .filters { display: flex; gap: 6px; }

  .filters button {
    padding: 6px 14px;
    border-radius: 999px;
    font-size: 14px;
  }

  .filters button[aria-selected="true"] {
    background: var(--text);
    border-color: var(--text);
    color: #fff;
  }

  /* 목록 */
  ul {
    list-style: none;
    margin: 0;
    padding: 0;
  }

  li {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 11px 20px;
    border-bottom: 1px solid var(--line);
  }
  li:last-child { border-bottom: none; }

  input[type="checkbox"] {
    width: 17px;
    height: 17px;
    flex-shrink: 0;
    cursor: pointer;
    accent-color: var(--accent);
  }

  .todo-text {
    flex: 1;
    min-width: 0;
    overflow-wrap: anywhere;
  }

  li.done .todo-text {
    text-decoration: line-through;
    color: var(--muted);
  }

  .badge {
    flex-shrink: 0;
    font-size: 12px;
    font-weight: 600;
    padding: 3px 9px;
    border-radius: 999px;
  }
  .badge.work     { background: var(--work-bg);     color: var(--work-fg); }
  .badge.personal { background: var(--personal-bg); color: var(--personal-fg); }
  .badge.study    { background: var(--study-bg);    color: var(--study-fg); }

  .row-actions {
    display: flex;
    gap: 4px;
    flex-shrink: 0;
  }
  .row-actions button {
    padding: 4px 9px;
    font-size: 13px;
    color: var(--muted);
  }

  /* 편집 모드 */
  li.editing .edit-input {
    flex: 1;
    min-width: 0;
  }

  /* 빈 상태 */
  .empty {
    padding: 40px 20px;
    text-align: center;
    color: var(--muted);
  }
</style>
</head>
<body>

<div class="app">

  <header class="section">
    <h1>할 일 관리</h1>
    <div class="progress-row">
      <div class="progress-track" id="progress-bar" role="progressbar"
           aria-label="할 일 진행률" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div class="progress-fill" id="progress-fill"></div>
      </div>
      <span class="progress-text" id="progress-text">0 / 0 (0%)</span>
    </div>
  </header>

  <div class="section">
    <div class="input-row">
      <input type="text" id="todo-input" placeholder="할 일을 입력하세요"
             maxlength="200" aria-label="할 일 입력">
      <select id="category-select" aria-label="카테고리 선택">
        <option value="work">업무</option>
        <option value="personal">개인</option>
        <option value="study">공부</option>
      </select>
      <button class="primary" id="add-button">추가</button>
    </div>
  </div>

  <div class="section">
    <div class="filters" id="filters" role="tablist" aria-label="카테고리 필터">
      <button role="tab" data-filter="all" aria-selected="true">전체</button>
      <button role="tab" data-filter="work" aria-selected="false">업무</button>
      <button role="tab" data-filter="personal" aria-selected="false">개인</button>
      <button role="tab" data-filter="study" aria-selected="false">공부</button>
    </div>
  </div>

  <ul id="todo-list"></ul>

</div>

<script>
  // ---------- 상수 ----------
  var STORAGE_KEY = "todoApp.v1";

  var CATEGORY_LABELS = {
    work: "업무",
    personal: "개인",
    study: "공부"
  };

  var VALID_CATEGORIES = Object.keys(CATEGORY_LABELS);

  // ---------- 상태 ----------
  var todos = [];
  var currentFilter = "all";
  var editingId = null;

  // 편집 중 입력한 값. 아직 저장되지 않았으므로 todos와는 별개로 들고 있다.
  // 이게 없으면 다른 줄을 건드려 재렌더가 일어나는 순간 입력 내용이 사라진다.
  var editingDraft = null; // { text, category }

  // ---------- 저장 계층 ----------

  // 항목마다 고유한 문자열 id를 만든다.
  // crypto.randomUUID()는 file://에서 브라우저별로 동작이 갈려 쓰지 않는다.
  function createId() {
    return Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
  }

  function saveTodos() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({ version: 1, todos: todos }));
    } catch (e) {
      console.warn("저장에 실패했습니다.", e);
    }
  }

  function loadTodos() {
    var raw = null;
    try {
      raw = localStorage.getItem(STORAGE_KEY);
    } catch (e) {
      console.warn("localStorage에 접근할 수 없습니다. 저장 없이 시작합니다.", e);
      todos = [];
      return;
    }

    if (!raw) {
      todos = [];
      return;
    }

    try {
      var parsed = JSON.parse(raw);
      var items = Array.isArray(parsed.todos) ? parsed.todos : [];
      todos = items.filter(isValidTodo).map(normalizeTodo);

      if (todos.length !== items.length) {
        console.warn("형식이 맞지 않는 항목 " + (items.length - todos.length) + "개를 건너뜁니다.");
      }
    } catch (e) {
      console.warn("저장된 데이터를 읽을 수 없어 빈 목록으로 시작합니다.", e);
      todos = [];
    }
  }

  // JSON으로는 읽히지만 형식이 깨진 항목이 섞여 있을 수 있다.
  // 그대로 그리면 배지가 "undefined"로 나오는 식으로 화면이 망가진다.
  function isValidTodo(item) {
    return !!item
      && typeof item.id === "string" && item.id !== ""
      && typeof item.text === "string"
      && VALID_CATEGORIES.indexOf(item.category) !== -1;
  }

  function normalizeTodo(item) {
    return {
      id: item.id,
      text: item.text.slice(0, 200),
      category: item.category,
      done: item.done === true,
      createdAt: typeof item.createdAt === "number" ? item.createdAt : Date.now()
    };
  }

  // ---------- 화면 ----------

  // 현재 필터에 걸린 항목만 돌려준다. 진행률도 이 결과를 기준으로 센다.
  // 항상 새 배열을 돌려준다. 원본을 그대로 넘기면 호출한 쪽에서
  // 정렬 같은 걸 했을 때 todos가 조용히 바뀌어 버린다.
  function getVisibleTodos() {
    if (currentFilter === "all") {
      return todos.slice();
    }
    return todos.filter(function (todo) {
      return todo.category === currentFilter;
    });
  }

  function createTodoElement(todo) {
    var li = document.createElement("li");
    li.dataset.id = todo.id;
    if (todo.done) {
      li.classList.add("done");
    }

    var checkbox = document.createElement("input");
    checkbox.type = "checkbox";
    checkbox.checked = todo.done;
    checkbox.dataset.action = "toggle";

    // 사용자 입력은 textContent로만 넣는다. innerHTML을 쓰면 스크립트가 실행된다.
    var text = document.createElement("span");
    text.className = "todo-text";
    text.textContent = todo.text;

    var badge = document.createElement("span");
    badge.className = "badge " + todo.category;
    badge.textContent = CATEGORY_LABELS[todo.category] || todo.category;

    var editButton = document.createElement("button");
    editButton.dataset.action = "edit";
    editButton.textContent = "수정";

    var removeButton = document.createElement("button");
    removeButton.dataset.action = "remove";
    removeButton.textContent = "삭제";

    var actions = document.createElement("span");
    actions.className = "row-actions";
    actions.appendChild(editButton);
    actions.appendChild(removeButton);

    li.appendChild(checkbox);
    li.appendChild(text);
    li.appendChild(badge);
    li.appendChild(actions);
    return li;
  }

  // 편집 중인 한 줄. 텍스트와 카테고리를 함께 바꿀 수 있다.
  function createEditElement(todo) {
    var li = document.createElement("li");
    li.dataset.id = todo.id;
    li.classList.add("editing");

    // 저장된 값이 아니라 편집 중인 값(draft)을 그린다.
    // 그래서 재렌더가 일어나도 입력하던 내용이 남는다.
    var draft = editingDraft || { text: todo.text, category: todo.category };

    var input = document.createElement("input");
    input.type = "text";
    input.className = "edit-input";
    input.value = draft.text;
    input.maxLength = 200;
    input.setAttribute("aria-label", "할 일 수정");

    var select = document.createElement("select");
    select.className = "edit-category";
    select.setAttribute("aria-label", "카테고리 수정");
    VALID_CATEGORIES.forEach(function (key) {
      var option = document.createElement("option");
      option.value = key;
      option.textContent = CATEGORY_LABELS[key];
      if (key === draft.category) {
        option.selected = true;
      }
      select.appendChild(option);
    });

    var saveButton = document.createElement("button");
    saveButton.dataset.action = "save";
    saveButton.textContent = "저장";

    var cancelButton = document.createElement("button");
    cancelButton.dataset.action = "cancel";
    cancelButton.textContent = "취소";

    var actions = document.createElement("span");
    actions.className = "row-actions";
    actions.appendChild(saveButton);
    actions.appendChild(cancelButton);

    li.appendChild(input);
    li.appendChild(select);
    li.appendChild(actions);
    return li;
  }

  // 빈 상태는 두 가지를 구분한다. 할 일이 아예 없는 것과, 이 필터에만 없는 것.
  function createEmptyElement() {
    var li = document.createElement("li");
    li.className = "empty";
    li.textContent = todos.length === 0
      ? "할 일을 추가해 보세요"
      : "이 카테고리에는 할 일이 없습니다";
    return li;
  }

  function renderList() {
    var list = document.getElementById("todo-list");
    var visible = getVisibleTodos();

    list.textContent = "";

    if (visible.length === 0) {
      list.appendChild(createEmptyElement());
      return;
    }

    visible.forEach(function (todo) {
      list.appendChild(
        todo.id === editingId ? createEditElement(todo) : createTodoElement(todo)
      );
    });
  }

  function findRow(id) {
    var rows = document.querySelectorAll("#todo-list li");
    for (var i = 0; i < rows.length; i++) {
      if (rows[i].dataset.id === id) {
        return rows[i];
      }
    }
    return null;
  }

  // 전체 재렌더 방식에서는 render()마다 목록의 DOM이 통째로 교체되고,
  // 포커스가 body로 날아간다. 편집 중인 입력창뿐 아니라 체크박스와 버튼도 마찬가지라,
  // 키보드 사용자는 항목 하나를 체크할 때마다 맨 위부터 Tab을 다시 눌러야 한다.
  // 그래서 어느 줄의 무엇에 포커스가 있었는지를 재렌더 전에 기억해 둔다.
  function captureFocus() {
    var active = document.activeElement;
    if (!active || !active.closest) {
      return null;
    }
    var row = active.closest("#todo-list li");
    if (!row) {
      return null;
    }
    return { id: row.dataset.id, action: active.dataset.action || null };
  }

  function restoreFocus(snapshot) {
    // 편집 중이면 언제나 편집 입력창이 우선이다.
    if (editingId !== null) {
      var editInput = document.querySelector("#todo-list li.editing .edit-input");
      if (editInput) {
        editInput.focus();
        var end = editInput.value.length;
        editInput.setSelectionRange(end, end); // 커서를 텍스트 끝에 둔다
        return;
      }
    }

    if (!snapshot) {
      return;
    }

    var row = findRow(snapshot.id);
    if (!row) {
      return; // 삭제되었거나 필터에서 빠진 줄
    }

    var target = snapshot.action
      ? row.querySelector('[data-action="' + snapshot.action + '"]')
      : null;
    if (target) {
      target.focus();
    }
  }

  function renderProgress() {
    var visible = getVisibleTodos();
    var total = visible.length;
    var done = visible.filter(function (todo) {
      return todo.done;
    }).length;

    // 항목이 없을 때 0으로 나누지 않는다.
    var percent = total === 0 ? 0 : Math.round((done / total) * 100);

    document.getElementById("progress-fill").style.width = percent + "%";
    document.getElementById("progress-bar").setAttribute("aria-valuenow", String(percent));
    document.getElementById("progress-text").textContent =
      done + " / " + total + " (" + percent + "%)";
  }

  function render() {
    var focusSnapshot = captureFocus();
    renderList();
    renderProgress();
    restoreFocus(focusSnapshot);
  }

  // ---------- 동작 ----------

  function findTodo(id) {
    for (var i = 0; i < todos.length; i++) {
      if (todos[i].id === id) {
        return todos[i];
      }
    }
    return null;
  }

  // 거부를 조용히 넘기지 않고 눈에 보이게 알린다.
  function flagInvalid(input) {
    input.classList.remove("invalid");
    void input.offsetWidth; // 애니메이션을 다시 돌리기 위한 강제 리플로우
    input.classList.add("invalid");
  }

  function addTodo() {
    var input = document.getElementById("todo-input");
    var select = document.getElementById("category-select");
    var text = input.value.trim();

    if (text === "" || text.length > 200) {
      flagInvalid(input);
      input.focus();
      return;
    }

    // 최근에 적은 것이 위에 보이도록 배열 앞에 넣는다.
    todos.unshift({
      id: createId(),
      text: text,
      category: select.value,
      done: false,
      createdAt: Date.now()
    });

    saveTodos();
    render();

    input.value = "";
    input.focus(); // 연속 입력을 위해 포커스를 유지한다
  }

  function toggleTodo(id) {
    var todo = findTodo(id);
    if (!todo) {
      return; // 없는 id는 조용히 무시한다
    }
    todo.done = !todo.done;
    saveTodos();
    render();
  }

  function deleteTodo(id) {
    var todo = findTodo(id);
    if (!todo) {
      return;
    }

    var label = todo.text.length > 30 ? todo.text.slice(0, 30) + "…" : todo.text;
    if (!window.confirm("'" + label + "'을(를) 삭제할까요?")) {
      return;
    }

    todos = todos.filter(function (item) {
      return item.id !== id;
    });
    saveTodos();
    render();
  }

  function updateFilterButtons() {
    var buttons = document.querySelectorAll("#filters button");
    Array.prototype.forEach.call(buttons, function (button) {
      button.setAttribute("aria-selected", String(button.dataset.filter === currentFilter));
    });
  }

  // 편집 상태는 UI 상태이므로 저장하지 않는다. saveTodos()를 부르지 않는 이유다.
  function startEdit(id) {
    var todo = findTodo(id);
    if (!todo) {
      return;
    }
    editingId = id;
    editingDraft = { text: todo.text, category: todo.category };
    render();
  }

  function cancelEdit() {
    editingId = null;
    editingDraft = null;
    render();
  }

  function saveEdit(id) {
    var todo = findTodo(id);
    if (!todo || !editingDraft) {
      return;
    }

    var text = editingDraft.text.trim();

    if (text === "" || text.length > 200) {
      var input = document.querySelector("#todo-list li.editing .edit-input");
      if (input) {
        flagInvalid(input);
        input.focus();
      }
      return; // 저장하지 않고 편집 모드를 유지한다
    }

    todo.text = text;
    todo.category = editingDraft.category;
    editingId = null;
    editingDraft = null;
    saveTodos();
    render();
  }

  // 필터는 저장하지 않는다. 새로고침하면 항상 전체로 돌아온다.
  function setFilter(filter) {
    currentFilter = filter;

    // 편집 중인 줄이 새 필터에서 보이지 않게 되면 편집을 끝낸다.
    // 보이지도 않는 줄이 편집 상태로 남아 있으면 저장도 취소도 할 수 없다.
    if (editingId !== null) {
      var editing = findTodo(editingId);
      if (!editing || (filter !== "all" && editing.category !== filter)) {
        editingId = null;
        editingDraft = null;
      }
    }

    updateFilterButtons();
    render();
  }

  // ---------- 이벤트 ----------

  var todoInput = document.getElementById("todo-input");

  document.getElementById("add-button").addEventListener("click", addTodo);

  todoInput.addEventListener("keydown", function (event) {
    if (event.key === "Enter") {
      addTodo();
    }
  });

  todoInput.addEventListener("input", function () {
    this.classList.remove("invalid");
  });

  // 목록 컨테이너 한 곳에만 리스너를 건다.
  // 재렌더로 <li>가 통째로 교체돼도 리스너를 다시 걸 필요가 없다.
  document.getElementById("todo-list").addEventListener("click", function (event) {
    var action = event.target.dataset.action;
    if (!action) {
      return;
    }

    var li = event.target.closest("li");
    if (!li) {
      return;
    }

    var id = li.dataset.id;

    if (action === "toggle") {
      toggleTodo(id);
    } else if (action === "remove") {
      deleteTodo(id);
    } else if (action === "edit") {
      startEdit(id);
    } else if (action === "save") {
      saveEdit(id);
    } else if (action === "cancel") {
      cancelEdit();
    }
  });

  // 편집 입력창의 Enter/Esc도 같은 컨테이너에서 위임으로 받는다.
  document.getElementById("todo-list").addEventListener("keydown", function (event) {
    if (!event.target.classList.contains("edit-input")) {
      return;
    }

    var li = event.target.closest("li");
    if (!li) {
      return;
    }

    if (event.key === "Enter") {
      saveEdit(li.dataset.id);
    } else if (event.key === "Escape") {
      cancelEdit();
    }
  });

  // 편집 중 입력은 draft에만 반영한다.
  // 여기서 render()를 부르면 글자를 칠 때마다 입력창이 교체되어 입력이 불가능해진다.
  document.getElementById("todo-list").addEventListener("input", function (event) {
    if (editingDraft && event.target.classList.contains("edit-input")) {
      editingDraft.text = event.target.value;
      event.target.classList.remove("invalid");
    }
  });

  document.getElementById("todo-list").addEventListener("change", function (event) {
    if (editingDraft && event.target.classList.contains("edit-category")) {
      editingDraft.category = event.target.value;
    }
  });

  // 필터 탭에도 같은 방식으로 리스너를 하나만 건다.
  document.getElementById("filters").addEventListener("click", function (event) {
    var filter = event.target.dataset.filter;
    if (!filter) {
      return;
    }
    setFilter(filter);
  });

  // ---------- 시작 ----------
  loadTodos();
  render();
</script>

</body>
</html>
